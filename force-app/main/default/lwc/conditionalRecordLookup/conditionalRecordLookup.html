<template>
    <div class="lookup">
        <lightning-input
            type="search"
            label={label}
            value={searchText}
            placeholder={placeholder}
            required={required}
            aria-expanded={hasSuggestions}
            aria-controls="lookup-options"
            onchange={handleSearch}>
        </lightning-input>
        <template lwc:if={selectedLabel}>
            <lightning-button-icon
                class="clear-button"
                icon-name="utility:close"
                alternative-text="Clear selection"
                title="Clear selection"
                onclick={handleClear}>
            </lightning-button-icon>
        </template>
        <template lwc:if={loading}>
            <lightning-spinner size="small" alternative-text="Searching related records"></lightning-spinner>
        </template>
        <template lwc:if={hasSuggestions}>
            <ul id="lookup-options" class="suggestions" role="listbox" aria-label="Related records">
                <template for:each={suggestions} for:item="option">
                    <li key={option.recordId} role="presentation">
                        <button
                            class="suggestion"
                            type="button"
                            role="option"
                            data-record-id={option.recordId}
                            onclick={handleSelect}>
                            {option.label}
                        </button>
                    </li>
                </template>
            </ul>
        </template>
        <template lwc:if={errorMessage}>
            <div class="slds-form-element__help" role="alert">{errorMessage}</div>
        </template>
    </div>
</template>
